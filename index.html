<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level Pong</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1020;
        color: #f8fafc;
      }

      .game-shell {
        width: min(92vw, 900px);
        text-align: center;
      }

      h1 {
        margin-bottom: 0.25rem;
      }

      p {
        margin-top: 0;
        color: #cbd5e1;
      }

      canvas {
        width: 100%;
        max-width: 900px;
        aspect-ratio: 3 / 2;
        border: 4px solid #38bdf8;
        border-radius: 10px;
        background: #020617;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      .controls {
        margin-top: 0.75rem;
        color: #94a3b8;
      }

      .button-row {
        margin-top: 0.75rem;
      }

      button {
        padding: 0.6rem 1rem;
        border-radius: 8px;
        border: 0;
        background: #0ea5e9;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #0284c7;
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <h1>Pong: Level 1</h1>
      <p>First to 5 points wins this level.</p>
      <canvas id="pong" width="900" height="600" aria-label="Pong game area"></canvas>
      <div class="controls">Move with <strong>W/S</strong> or <strong>Arrow Up/Arrow Down</strong>.</div>
      <div class="button-row"><button id="restart">Restart Match</button></div>
    </main>

    <script src="game.js"></script>
  </body>
</html>
